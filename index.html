<style>
:root {
  --bg: #10131c;

  --accent: #ffd166;
  --blue: #78a9ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #283451 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

main {
  width: min(1100px, 94%);
  margin: auto;
  padding: 32px 0 48px;
}

header { text-align: center; margin-bottom: 28px; }

h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 48px);
  letter-spacing: .08em;
}

header p { color: var(--muted); margin-top: 10px; }

.machine {
  background: linear-gradient(145deg, #252d40, #171c28);
  border: 2px solid #46516b;
  border-radius: 24px;
  padding: clamp(14px, 3vw, 28px);
  box-shadow: 0 18px 55px #0007;
}

.reels {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.reel {
  min-width: 0;
  min-height: 165px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px 8px;
  border-radius: 15px;
  background: linear-gradient(#fff, #e9edf5);
  color: #202638;
  border: 2px solid #c8d0e0;
  overflow-wrap: anywhere;
  transition: border-color .2s, transform .2s;
}

.reel .number {
  font-size: 12px;
  color: #69758d;
  margin-bottom: 12px;
}

.reel .value {
  font-size: clamp(13px, 2vw, 18px);
  font-weight: 750;
  line-height: 1.55;
}

.reel:last-child {
  background: linear-gradient(#fff8df, #ffe5a1);
  border-color: var(--accent);
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 24px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 14px 28px;
  font-size: 16px;
  font-weight: 750;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

button:hover { transform: translateY(-2px); }
button:disabled { opacity: .5; cursor: wait; transform: none; }

#spinButton {
  background: linear-gradient(135deg, #ffe08a, #ffb938);
  color: #28202a;
  min-width: 200px;
  box-shadow: 0 5px 0 #b77a1b;
}

#resetButton {
  background: #343e53;
  color: white;
}

.result {
  margin-top: 22px;
  padding: 22px;
  border: 1px solid #46516b;
  border-radius: 18px;
  background: #171c28dd;
}

.result h2 { margin: 0 0 10px; font-size: 19px; }
#resultTopic { font-size: clamp(19px, 3vw, 26px); font-weight: 750; line-height: 1.6; }
#resultPath { color: var(--muted); font-size: 14px; line-height: 1.8; }

.notice {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-top: 18px;
}

details {
  margin-top: 26px;
  padding: 16px;
  background: #1c2230;
  border-radius: 14px;
  color: var(--muted);
}

details summary { cursor: pointer; color: var(--text); font-weight: 700; }
details p { line-height: 1.8; }

@media (max-width: 650px) {
  main { padding-top: 22px; }
  .reels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .reel { min-height: 110px; }
  .reel:last-child { grid-column: 1 / -1; }
  .reel .value { font-size: 16px; }
  #spinButton { width: 100%; }
}
</style>
</head>

      deep: "具体例を挙げる"
    }
  ];

  const rule = rules.find(item =>
    item.words.some(word => topic.includes(word))
  );

  if (rule) {
    return {
      middle: rule.middle,
      small: rule.small,
      deep: rule.deep
    };
  }

  return {
    middle: pick(middleTypes),
    small: pick(smallTypes),
    deep: pick(deepTypes)
  };
}


function createResult() {
  const big = pick(bigGenres);
  const topic = getTopicForGenre(big);
  const related = getRelatedTypes(topic);

  if (big === "🎵 音楽") {
    const sub = pick(musicSubgenres);

    $("label1").textContent = "REEL 2 · 音楽サブジャンル";
    $("label2").textContent = "REEL 3 · 中ジャンル";
    $("label3").textContent = "REEL 4 · 小ジャンル";
    $("label4").textContent = "REEL 5 · お題";

    return {
      values: [
        big,
        sub,
        related.middle,
        related.small,
        topic
      ],
      path: `${big} → ${sub} → ${related.middle} → ${related.small}`,
      topic
    };
  }

  $("label1").textContent = "REEL 2 · 中ジャンル";
  $("label2").textContent = "REEL 3 · 小ジャンル";
  $("label3").textContent = "REEL 4 · 深掘り";
  $("label4").textContent = "REEL 5 · お題";

  return {
    values: [
      big,
      related.middle,
      related.small,
      related.deep,
      topic
    ],
    path: `${big} → ${related.middle} → ${related.small} → ${related.deep}`,
    topic
  };
}

let busy = false;


function spin() {
  if (busy) return;
  busy = true;
  spinButton.disabled = true;

  const result = createResult();

  result.values.forEach((value, i) => {
    reels[i].textContent = value;
  });

  $("resultTopic").textContent = result.topic;
  $("resultPath").textContent = result.path;

  busy = false;
  spinButton.disabled = false;
}

function reset() {
  if (busy) return;

  reels.forEach(reel => reel.textContent = "？？？");

  $("label1").textContent = "REEL 2 · 中ジャンル";
  $("label2").textContent = "REEL 3 · 小ジャンル";
  $("label3").textContent = "REEL 4 · 深掘り";
  $("label4").textContent = "REEL 5 · お題";

  $("resultTopic").textContent = "「ガチャを回す！」を押してね。";
  $("resultPath").textContent = "どんなお題が出るかはお楽しみ！";
}

spinButton.addEventListener("click", spin);
$("resetButton").addEventListener("click", reset);

// 起動時のジャンル数チェック
console.log("固定ジャンル:", fixedGenres.length);
console.log("更新型ジャンル:", updateGenres.length);
console.log("合計ジャンル:", bigGenres.length);
</script>
